name: Publicar dashboard cada jueves

on:
  schedule:
    - cron: '0 12 * * 4'  # Todos los jueves a las 09:00 hora Chile (UTC-3)
  workflow_dispatch:       # Permite ejecutarlo manualmente si es necesario

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fusionar borrador en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge origin/borrador --no-edit -m "Publicación automática jueves"
          git push origin main
